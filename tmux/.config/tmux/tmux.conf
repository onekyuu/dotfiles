set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:Tc"
set -ag terminal-overrides ",*:Ms=\\E]52;%p1%s;%p2%s\\007"
set -ag terminal-features ",ghostty:hyperlinks"
set -g allow-passthrough on
set -g visual-activity off

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @powerkit_theme "catppuccin"
set -g @powerkit_theme_variant "mocha"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_plugins "git,datetime"
set -g @powerkit_plugin_datetime_format "%Y-%m-%d %A"
set -g @theme_enable_icons 1

setw -g mode-keys vi
set -g mouse on
unbind C-b
set -g prefix C-a
set -g status-left-length 40
bind C-a send-prefix
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind-key D display-popup -E -w 70% -h 70% "ddgr -n 5"
# 进入 Visual 模式选择文本：按 'v'
bind-key -T copy-mode-vi 'v' send -X begin-selection
# 复制选中的文本：按 'y'
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
# 映射大写 Y 为：移动到行首 -> 开始选择 -> 移动到行尾 -> 复制
bind-key -T copy-mode-vi Y send-keys -X start-of-line \; send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
# 调整面板大小 (Vim 风格)
# -r 表示可重复按键 (按一次前缀，可以连续按 h/j/k/l)
# 5 表示每次调整 5 个单元格
bind -r [ resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r ] resize-pane -R 5

# 如果想要微调 (每次 1 个格)，可以绑定大写键
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

set -g @plugin 'tmux-plugins/tpm'

run-shell '~/.config/tmux/plugins/tpm/tpm'
set -g status-position bottom

